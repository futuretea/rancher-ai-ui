aiConfig:
  label: AI 助手
  form:
    header: AI 模型配置
    description: 为您的助手配置 AI 模型和提供商
    section:
      provider:
        header: AI 聊天机器人提供商
        description: 为您的聊天机器人选择 AI 提供商
        banner:
          header: "隐私声明："
          description: '使用外部第三方提供商时，请注意本平台不拥有或控制此 LLM，也不为其输出负责。您的提示和数据将发送到提供商的服务器。这些提供商可能会根据其隐私政策使用您的数据。公共 LLM 的额外风险是其用于训练的数据集范围更广。您的输入数据可能会被纳入该数据集，使其可被其他用户访问或用于未来模型训练。<br><br>对于高度敏感或机密信息，我们强烈建议使用本地提供商。'
      rag:
        header: RAG（检索增强生成）
        description: 启用 RAG 让您的聊天机器人更智能，获得外部知识访问权限
        banner: RAG（检索增强生成）允许聊天机器人在生成响应之前搜索知识库。这减少了幻觉，并基于您的特定数据提供更准确、更新的答案。
      langfuse:
        header: Langfuse 配置
        description: 连接到 Langfuse 以监控、跟踪和调试您的 AI 助手
        banner: Langfuse 是用于监控 LLM 应用程序的开源工具。这些设置将您的聊天机器人连接到 Langfuse 服务器，以便您可以分析性能并排查问题。主机是服务器地址，密钥用于验证您的应用程序。
    EMBEDDINGS_MODEL:
      label: 嵌入模型
    ENABLE_RAG:
      label: 为此助手启用 RAG
    DEEPSEEK_API_KEY:
      label: DeepSeek API 密钥
      description: 向 DeepSeek 验证请求的密钥
    LANGFUSE_HOST:
      label: Langfuse 主机
      description: 您的 Langfuse 服务器 URL（例如，https://cloud.langfuse.com）
    LANGFUSE_PUBLIC_KEY:
      label: Langfuse 公钥
      description: 客户端事件和用户反馈的公共 API 密钥（可安全暴露）
    LANGFUSE_SECRET_KEY:
      label: Langfuse 密钥
      description: 服务器到服务器通信的私有 API 密钥（保持机密）
    MODEL:
      label: 模型
      description: 选择用于生成响应的 AI 模型
    OLLAMA_URL:
      label: Ollama URL
      description: 您的 Ollama 实例所在 URL
    OPENAI_URL:
      label: OpenAI 第三方 URL
      description: （可选）第三方 OpenAI 兼容服务的 URL，如 Azure 或 Evroc
    OPENAI_API_KEY:
      label: OpenAI 密钥
      description: 向 OpenAI 服务验证请求的密钥
    SYSTEM_PROMPT:
      label: 系统提示
    ACTIVE_LLM:
      label: AI 聊天机器人
      options:
        ollama:
          name: 本地 (Ollama)
          description: 使用 Ollama 在本地运行模型
        openai:
          name: OpenAI API
          description: 使用 OpenAI 服务（自定义端点）
        deepseek:
          name: DeepSeek
          description: 使用 DeepSeek 模型
