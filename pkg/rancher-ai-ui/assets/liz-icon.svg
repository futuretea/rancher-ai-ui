<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#ff6666;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#990000;stop-opacity:1" />
    </radialGradient>
    
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ccff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:0.4" />
    </linearGradient>
  </defs>

  <g fill="none" stroke="#1c4e80" stroke-width="2.5">
    <circle cx="100" cy="100" r="25" />
    <circle cx="100" cy="100" r="35" opacity="0.7"/>
    <circle cx="100" cy="100" r="45" opacity="0.4"/>
  </g>

  <circle cx="100" cy="100" r="18" fill="none" stroke="#ff3333" stroke-width="3" opacity="0.5" />
  <circle cx="100" cy="100" r="12" fill="url(#coreGlow)" />
  <circle cx="96" cy="96" r="4" fill="#ffffff" opacity="0.6" />

  <g fill="none" stroke="url(#orbitGrad)" stroke-linecap="round">
    
    <g transform="rotate(-45 100 100)">
      <ellipse cx="100" cy="100" rx="80" ry="25" stroke-width="2.5" />
      <circle cx="180" cy="100" r="3.5" fill="#66d9ff" stroke="none" />
    </g>

    <g transform="rotate(45 100 100)">
      <ellipse cx="100" cy="100" rx="75" ry="20" stroke-width="2.5" opacity="0.9"/>
      <circle cx="25" cy="100" r="3" fill="#66d9ff" stroke="none" />
    </g>

    <g transform="rotate(-10 100 100)">
      <ellipse cx="100" cy="100" rx="65" ry="35" stroke-width="2" opacity="0.6" stroke-dasharray="100, 30"/>
    </g>

    <g transform="rotate(80 100 100)">
      <ellipse cx="100" cy="100" rx="70" ry="15" stroke-width="1.5" opacity="0.5" />
      <circle cx="170" cy="100" r="2.5" fill="#66d9ff" stroke="none" />
    </g>
  </g>

  <g fill="#00ccff" opacity="0.6">
    <circle cx="160" cy="50" r="2.5" />
    <circle cx="40" cy="150" r="2.5" />
    <circle cx="120" cy="180" r="2" />
    <circle cx="60" cy="40" r="2" />
  </g>

</svg>
